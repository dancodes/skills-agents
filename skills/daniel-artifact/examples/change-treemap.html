<title>ORD-31 Change Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f7f7f4;
  --panel: #eeede7;
  --surface: #ffffff;
  --ink: #1a1914;
  --muted: #4f4d46;
  --faint: #7d7b73;
  --line: #d3d1c8;
  --accent: #c93f00;
  --accent-soft: #f8dccb;
  --crit: #b4231f;
  --crit-soft: #f9dcd9;
  --warn: #8a5a00;
  --warn-soft: #f6e7c8;
  --ok: #1d6b3a;
  --ok-soft: #d9efe0;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: #14120b; --panel: #1b1912; --surface: #252219; --ink: #efeeea; --muted: #b3b1a9; --faint: #7f7d75; --line: #353229;
  --accent: #ff7a3d; --accent-soft: #3d2416;
  --crit: #ff8a80; --crit-soft: #3d1a17; --warn: #f0c060; --warn-soft: #3a2c10; --ok: #7fd6a0; --ok-soft: #173322;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration-color: var(--faint); text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
code { font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

.app { max-width: 1480px; margin: 0 auto; padding-bottom: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 14px 12px; border-bottom: 1px solid var(--line); }
.ttl { display: grid; gap: 2px; min-width: 0; }
h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.sub b { color: var(--ink); font-weight: 500; }
.right { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.sib { font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
.sib:hover { color: var(--ink); }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.seg button { border: 0; background: transparent; padding: 4px 11px; border-radius: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.seg button[aria-checked="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

.view { display: grid; gap: 12px; padding-block: 12px; align-content: start; }
.prose { max-width: 72ch; display: grid; gap: 10px; }
.prose h2 { margin: 12px 0 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; text-wrap: balance; }
.prose h3 { margin: 8px 0 0; font-size: 13.5px; font-weight: 600; }
.prose h4 { margin: 4px 0 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.prose p, .prose ul, .prose ol { margin: 0; line-height: 1.6; }
.prose ul, .prose ol { padding-left: 20px; display: grid; gap: 3px; }
.prose blockquote { margin: 0; padding: 4px 12px; border-left: 2px solid var(--line); color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 11px; color: var(--faint); }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 8px 0; width: 100%; }

.pane, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.pane-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.pane-h b { color: var(--ink); font-weight: 500; }
.pane-b { padding: 8px 4px 10px; overflow-x: auto; }
.body { overflow-x: auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.span2 { grid-column: 1 / -1; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 9px 12px; font-size: 12px; }
.kv div { display: grid; }
.kv i { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.kv span { font-family: var(--mono); font-size: 12.5px; }
.foot { padding: 7px 12px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); }

table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 5px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-weight: 500; font-size: 11px; color: var(--muted); }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
td.n { color: var(--faint); width: 1%; font-family: var(--mono); font-size: 11px; }
td.mono { font-family: var(--mono); font-size: 11.5px; }
td.wrap { white-space: normal; }
td.blank { color: var(--faint); }
td .s { color: var(--faint); font-size: 11px; }
tr.tot td { font-weight: 600; border-top: 1px solid var(--ink); }

.rules { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.rules li { padding: 9px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.rules b { font-size: 12px; font-weight: 600; }
.rules span { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 11.5px; color: var(--muted); }
.legend > span { display: inline-flex; gap: 5px; align-items: center; }

.callout { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 9px 12px; display: grid; gap: 3px; }
.callout.crit { border-left-color: var(--crit); }
.callout.ok { border-left-color: var(--ok); }
.callout .label, .label { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.callout p { margin: 0; line-height: 1.55; }
.codeblock { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.codeblock .file { padding: 6px 12px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.codeblock .add { background: var(--ok-soft); color: var(--ok); display: inline-block; min-width: 100%; }
.codeblock .del { background: var(--crit-soft); color: var(--crit); display: inline-block; min-width: 100%; }
.codeblock .hl { background: var(--accent-soft); display: inline-block; min-width: 100%; }
.codeblock .cmt { color: var(--faint); }

.fl { font-family: var(--sans); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; background: var(--surface); white-space: nowrap; }
.fl.a { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
.fl.crit { color: var(--crit); border-color: var(--crit-soft); background: var(--crit-soft); }
.fl.warn { color: var(--warn); border-color: var(--warn-soft); background: var(--warn-soft); }
.fl.ok { color: var(--ok); border-color: var(--ok-soft); background: var(--ok-soft); }

.chip { --bl: 0.93; --bc: 0.04; --dl: 0.31; display: inline-block; font-family: var(--mono); font-weight: 500; font-size: 12px; line-height: 17px; padding: 0 6px; border-radius: 4px; white-space: nowrap;
  background: oklch(var(--bl) var(--bc) var(--h, 250)); color: oklch(0.33 0.11 var(--h, 250)); border: 1px solid oklch(calc(var(--bl) - 0.12) calc(var(--bc) + 0.03) var(--h, 250)); }
:root[data-mode="dark"] .chip { background: oklch(var(--dl) 0.06 var(--h, 250)); color: oklch(0.92 0.065 var(--h, 250)); border-color: oklch(calc(var(--dl) + 0.13) 0.075 var(--h, 250)); }
.chip.k-enum { border-style: dashed; }
.chip.k-union { border-style: dotted; border-width: 1.5px; }
.chip.k-external { background: transparent; }
.rules .chip, .legend .chip { font-size: 10.5px; line-height: 15px; padding: 0 4px; }
.chip { --mk: oklch(0.7 0.11 var(--h, 250)); --wash: oklch(0.965 0.018 var(--h, 250)); }
:root[data-mode="dark"] .chip { --mk: oklch(0.72 0.1 var(--h, 250)); --wash: oklch(0.27 0.025 var(--h, 250)); }
:is(:root[data-chips="dot"], :root[data-chips="dotwash"], :root[data-chips="bar"]) .chip { background: none; border: 0; border-radius: 0; padding: 0; color: var(--ink); }
:is(:root[data-chips="dot"], :root[data-chips="dotwash"]) .chip::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--mk); vertical-align: 1px; }
:is(:root[data-chips="dot"], :root[data-chips="dotwash"]) .chip.k-enum::before { border-radius: 1.5px; }
:is(:root[data-chips="dot"], :root[data-chips="dotwash"]) .chip.k-union::before { border-radius: 1px; transform: rotate(45deg) scale(0.85); }
:is(:root[data-chips="dot"], :root[data-chips="dotwash"]) .chip.k-external::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--mk); }
:root[data-chips="dotwash"] .chip { background: var(--wash); border-radius: 4px; padding: 0 6px 0 5px; }
:root[data-chips="bar"] .chip { border-left: 3px solid var(--mk); padding-left: 5px; }
:root[data-chips="bar"] .chip.k-enum { border-left-style: dashed; }
:root[data-chips="bar"] .chip:is(.k-union, .k-external) { border-left-style: dotted; }

@media (max-width: 760px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* page */
.tbtn { display: inline-flex; gap: 6px; }
.tbtn button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
.tbtn button:hover { color: var(--ink); }
.row .ty { font-size: 11.5px; color: var(--faint); }
.hint { margin: 0; font-size: 11.5px; color: var(--faint); }
</style>


<div class="app">
  <header class="top">
    <div class="ttl">
      <h1>ORD-31 Change Map</h1>
      <span class="sub">danielsorichetti/ord-31-partial-refunds · <b>kpwqzlrn</b> · <span id="totals"></span></span>
    </div>
    <div class="right">
      <div class="seg" role="radiogroup" aria-label="Theme">
        <button type="button" role="radio" data-mode="light" aria-checked="true">Light</button>
        <button type="button" role="radio" data-mode="dark" aria-checked="false">Dark</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="Name style" id="chip-picker">
        <button type="button" role="radio" data-cs="dot" aria-checked="false" tabindex="-1">Dot</button>
        <button type="button" role="radio" data-cs="dotwash" aria-checked="true">Dot + wash</button>
        <button type="button" role="radio" data-cs="bar" aria-checked="false" tabindex="-1">Left bar</button>
        <button type="button" role="radio" data-cs="chip" aria-checked="false" tabindex="-1">Chip</button>
      </div>
      <nav class="seg" role="tablist" aria-label="Views">
        <button type="button" role="tab" data-view="map" aria-selected="true">Map</button>
        <button type="button" role="tab" data-view="list" aria-selected="false">List</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="view" id="v-map">
      <ul class="rules" id="facts"></ul>
      <div id="map"></div>
      <p class="hint">Click a group's title bar or a closed block to zoom in. Click a crumb or press Esc to zoom out. Hover a tile for what it does.</p>
    </section>
    <section class="view" id="v-list" hidden>
      <div class="pane">
        <div class="pane-h"><span><b>Files by job</b> · highest level first</span>
          <span class="tbtn"><button type="button" data-act="open">Open one level</button><button type="button" data-act="all">Open all</button><button type="button" data-act="reset">Collapse</button></span>
        </div>
        <div class="pane-b" id="tree"></div>
      </div>
    </section>
  </main>
</div>

<script>
const CHIP_ORDER = ["RefundDialog", "RefundApi", "OrderPage", "Extras", "Checks", "RefundForm", "RefundSummary", "RefundEndpoint", "RefundService", "RefundStorage", "UiChecks", "ApiChecks"];

const modeButtons = document.querySelectorAll("[data-mode]");
function setMode(mode) {
  document.documentElement.setAttribute("data-mode", mode);
  modeButtons.forEach(b => b.setAttribute("aria-checked", String(b.dataset.mode === mode)));
  try { localStorage.setItem("daniel-artifact-mode", mode); } catch (e) {}
}
let savedMode = "light";
try { savedMode = localStorage.getItem("daniel-artifact-mode") || "light"; } catch (e) {}
setMode(savedMode === "dark" ? "dark" : "light");
modeButtons.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

const chipButtons = [...document.querySelectorAll("#chip-picker [data-cs]")];
const chipStyles = chipButtons.map(b => b.dataset.cs);
function setChips(cs, focus) {
  if (!chipStyles.includes(cs)) cs = "dotwash";
  document.documentElement.setAttribute("data-chips", cs);
  chipButtons.forEach(b => { const on = b.dataset.cs === cs; b.setAttribute("aria-checked", String(on)); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); });
  try { localStorage.setItem("daniel-artifact-chips", cs); } catch (e) {}
}
function stepChips(d, focus) {
  const i = chipStyles.indexOf(document.documentElement.getAttribute("data-chips"));
  setChips(chipStyles[(i + d + chipStyles.length) % chipStyles.length], focus);
}
let savedChips = "dotwash";
try { savedChips = localStorage.getItem("daniel-artifact-chips") || "dotwash"; } catch (e) {}
setChips(savedChips);
chipButtons.forEach(b => b.addEventListener("click", () => setChips(b.dataset.cs, true)));
document.addEventListener("keydown", e => {
  const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!d || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  const a = document.activeElement;
  const inPicker = a && a.closest && a.closest("#chip-picker");
  if (!inPicker && a && a !== document.body) return;
  e.preventDefault();
  stepChips(d, !!inPicker);
});

const CHIP_TIERS = [[0.94, 0.038, 0.3], [0.86, 0.075, 0.4], [0.79, 0.098, 0.23]];
function chipStyle(name) {
  let i = CHIP_ORDER.indexOf(name);
  if (i < 0) { i = 0; for (const c of name) i = (i * 31 + c.charCodeAt(0)) >>> 0; }
  const [bl, bc, dl] = CHIP_TIERS[i % 3];
  return `--h:${Math.round((25 + i * 137.508) % 360)};--bl:${bl};--bc:${bc};--dl:${dl}`;
}
function chip(name, kind = "model") {
  const esc = String(name).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  return `<b class="chip k-${kind}" style="${chipStyle(name)}">${esc}</b>`;
}
document.querySelectorAll("[data-chip]").forEach(el => { el.outerHTML = chip(el.dataset.chip, el.dataset.kind); });

const tabs = document.querySelectorAll("[data-view]");
const views = [...tabs].map(b => b.dataset.view);
function show(v) {
  if (!views.length) return;
  if (!views.includes(v)) v = views[0];
  tabs.forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  views.forEach(x => { document.getElementById("v-" + x).hidden = x !== v; });
}
tabs.forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.view; show(b.dataset.view); }));
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));

const G = (key, label, doc, items) => ({ key, label, doc, items });
const F = (name, st, add, del, d, tags = []) => ({ name, st, add, del, d, tags: st === "deleted" ? [["crit", "deleted"], ...tags] : tags });
const NEW = "added", MOD = "modified", DEL = "deleted";
const RN = [["", "rename"]];

const DATA = [
  G("RefundDialog", "Refund dialog", "The new partial refund flow the support agent sees.", [
    G("RefundForm", "Form", "Pick line items and amounts, then confirm.", [
      F("RefundDialog.tsx", NEW, 142, 0, "Dialog root: line items, amount, reason, confirm"),
      F("RefundLineItems.tsx", NEW, 96, 0, "Checkbox per line item with a capped amount input"),
      F("RefundReasonSelect.tsx", NEW, 38, 0, "Reason dropdown", [["warn", "copy"]]),
      F("useRefundForm.ts", NEW, 88, 0, "Form state and the cap per line item"),
    ]),
    G("RefundSummary", "Summary", "What the customer gets back, before and after.", [
      F("RefundSummary.tsx", NEW, 61, 0, "Totals, tax and fees returned"),
      F("formatRefund.ts", MOD, 12, 4, "Reuses the money formatter", [["ok", "reuse"]]),
    ]),
  ]),
  G("RefundApi", "Refund API", "The server side: validate, call the payment provider, record the refund.", [
    G("RefundEndpoint", "Endpoint", "One POST per refund.", [
      F("refunds.controller.ts", NEW, 74, 0, "POST /orders/:id/refunds"),
      F("refund.schema.ts", NEW, 52, 0, "Request and response shapes"),
    ]),
    G("RefundService", "Service", "The rules a refund must pass.", [
      F("refund.service.ts", NEW, 131, 0, "Caps, idempotency key, provider call"),
      F("paymentProvider.ts", MOD, 28, 9, "Adds refund() beside charge()"),
      F("ledger.ts", MOD, 19, 2, "Writes the negative ledger row"),
    ]),
    G("RefundStorage", "Storage", "Where a refund is kept.", [
      F("0042_refunds.sql", NEW, 33, 0, "refunds table and its index"),
      F("refund.repository.ts", NEW, 47, 0, "Insert and list by order", [["warn", "copy"]]),
    ]),
  ]),
  G("OrderPage", "Order page", "Small changes where the order already shows money.", [
    F("OrderTimeline.tsx", MOD, 22, 6, "Shows refunds in the timeline"),
    F("OrderActions.tsx", MOD, 9, 3, "Refund button, renamed from Cancel"),
    F("CancelOrderButton.tsx", DEL, 0, 41, "Replaced by the Refund button"),
    F("orderLabels.ts", MOD, 4, 4, "Cancel → Refund", RN),
    F("helpText.json", MOD, 2, 2, "Cancel → Refund", RN),
  ]),
  G("Extras", "Extras", "Changes not needed for ORD-31.", [
    F("currency.ts", MOD, 14, 8, "Rounds yen to whole units", [["warn", "off-ticket"]]),
    F("package.json", MOD, 1, 1, "Bumps the payment SDK"),
    F("README.md", MOD, 26, 0, "Documents the refund flow"),
  ]),
  G("Checks", "Checks", "What checks each job.", [
    G("UiChecks", "Dialog tests", "Unit tests next to the dialog.", [
      F("RefundDialog.test.tsx", NEW, 118, 0, "Caps, reasons, confirm"),
      F("useRefundForm.test.ts", NEW, 64, 0, "Cap per line item"),
      F("OrderActions.test.tsx", MOD, 3, 3, "Button label", RN),
    ]),
    G("ApiChecks", "API tests", "Service and endpoint tests.", [
      F("refund.service.test.ts", NEW, 156, 0, "Caps, idempotency, provider errors"),
      F("refunds.e2e.test.ts", NEW, 92, 0, "Full POST against a test provider"),
      F("currency.test.ts", MOD, 11, 0, "Yen rounding", [["warn", "off-ticket"]]),
    ]),
  ]),
];
const ROOT = { label: "All files", items: DATA };

document.head.insertAdjacentHTML("beforeend", `<style>
.tm-pane { display: grid; min-width: 0; }
.tm-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.tm-crumbs { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 12px; min-width: 0; color: var(--muted); }
.tm-crumbs b { color: var(--ink); font-weight: 600; }
.tm-crumbs .tm-cs { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.tm-crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.tm-crumbs button:hover { text-decoration: underline; }
.tm-crumbs i { font-style: normal; color: var(--faint); }
.tm-ctrls { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.tm-ctrls .tm-lbl { font-size: 11px; color: var(--faint); }
.tm-ctrls .seg button { padding: 2px 8px; font-size: 11.5px; }
.tm-stage { position: relative; margin: 6px; overflow: hidden; }
.tm-grp, .tm-tile, .tm-blk { position: absolute; box-sizing: border-box; overflow: hidden; }
.tm-grp { border-radius: 4px; border: 1px solid oklch(0.78 0.04 var(--h)); background: oklch(0.955 0.012 var(--h)); }
.tm-grp.tm-d2, .tm-grp.tm-d3 { background: oklch(0.975 0.006 var(--h)); border-color: oklch(0.84 0.03 var(--h)); }

    + (fl.added ? `<span class="fl a">added</span>` : "")
    + (fl.was ? `<span class="fl a">was ${treeEsc(fl.was)}</span>` : "")
    + (fl.tags ? fl.tags.map(([c, t]) => `<span class="fl ${c}">${treeEsc(t)}</span>`).join("") : "")
    + (item.d ? `<span class="d">${treeEsc(item.d)}</span>` : "")
    + (ref ? `<span class="cnt">${countOf(ref)}</span>` : "");
  node.appendChild(row);
  if (!ref) return node;
  row.tabIndex = 0;
  row.setAttribute("role", "button");
  row.setAttribute("aria-expanded", "false");
  const kids = document.createElement("div");
  kids.hidden = true;
  node.appendChild(kids);
  const childPrefix = root ? "" : prefix + (last ? "   " : "│  ");
  node.toggle = open => {
    const want = open ?? kids.hidden;
    if (want && !kids.childElementCount) {
      const t = TYPES[ref];
      if (t.doc) {
        const doc = document.createElement("div");
        doc.className = "row doc";
        doc.innerHTML = `<span class="car"></span><span class="g">${childPrefix}│  </span><span>${treeEsc(t.doc)}</span>`;
        kids.appendChild(doc);
      }
      const items = childrenOf(ref);
      items.forEach((it, i) => kids.appendChild(makeNode(it, childPrefix, i === items.length - 1, false)));
    }
    kids.hidden = !want;
    row.setAttribute("aria-expanded", String(want));
    row.querySelector(".car").textContent = want ? "▾" : "▸";
  };
  row.addEventListener("click", () => node.toggle());
  row.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); node.toggle(); }
    if (e.key === "ArrowRight") node.toggle(true);
    if (e.key === "ArrowLeft") node.toggle(false);
  });
  return node;
}

function renderTree(el, roots) {
  el.innerHTML = "";
  for (const r of roots) {
    if (r.sep) { el.insertAdjacentHTML("beforeend", `<div class="sep">${treeEsc(r.sep)}</div>`); continue; }
    const n = makeNode({ f: "", ty: r.t, d: "" }, "", true, true);
    el.appendChild(n);
    n.toggle(true);
  }
}

function openLevel(el) {
  const closed = [];
  const walk = parent => {
    for (const n of parent.children) {
      if (!n.toggle) continue;
      const kids = n.children[1];
      if (kids.hidden) closed.push(n); else walk(kids);
    }
  };
  walk(el);
  closed.forEach(n => n.toggle(true));
}


const leaves = [];
(function walk(g) { g.items.forEach(i => i.items ? walk(i) : leaves.push(i)); })(ROOT);
const sum = (xs, k) => xs.reduce((a, x) => a + x[k], 0);
const fmt = n => n.toLocaleString("en-US");
const lines = xs => `+${fmt(sum(xs, "add"))} −${fmt(sum(xs, "del"))}`;
const has = (l, t) => l.tags.some(x => x[1] === t);
const isTest = l => /\.test\.tsx?$/.test(l.name);
const files = n => `${n} file${n === 1 ? "" : "s"}`;

document.getElementById("totals").textContent = `${files(leaves.length)} · ${lines(leaves)}`;
const fresh = leaves.filter(l => l.st === NEW && !isTest(l)), tests = leaves.filter(isTest);
document.getElementById("facts").innerHTML = [
  ["New source", `${files(fresh.length)}, ${lines(fresh)}.`],
  ["Tests", `${files(tests.length)}, ${lines(tests)}.`],
  ["Rename only", `${files(leaves.filter(l => has(l, "rename")).length)} change a label and nothing else.`],
  ["Flags", `${files(leaves.filter(l => has(l, "copy")).length)} copy code, ${files(leaves.filter(l => has(l, "off-ticket")).length)} off-ticket.`],
].map(([b, s]) => `<li><b>${b}</b><span>${s}</span></li>`).join("");

const firstTag = l => (l.tags.find(t => t[1] !== "rename") || l.tags[0] || [])[1];
const FLAG = { copy: "tm-warn", "off-ticket": "tm-crit", deleted: "tm-crit", reuse: "tm-ok", rename: "tm-grey" };
renderTreemap(document.getElementById("map"), {
  root: ROOT,
  unit: ["file", "files"],
  sizes: [
    { id: "lines", label: "Lines changed", value: l => l.add + l.del, note: "lines added + removed" },
    { id: "added", label: "Lines added", value: l => l.add, note: "lines added" },
    { id: "files", label: "One per file", value: () => 1, note: "one unit per file" },
  ],
  colors: [
    { id: "job", label: "Job" },
    { id: "status", label: "Status", cls: l => ({ added: "tm-ok", modified: "tm-plain", deleted: "tm-crit" })[l.st],
      legend: [["tm-ok", "Added"], ["tm-plain", "Modified"], ["tm-crit", "Deleted"]] },
    { id: "flags", label: "Flags", cls: l => FLAG[firstTag(l)],
      legend: [["tm-warn", "Copy"], ["tm-ok", "Reuse"], ["tm-crit", "Off-ticket or deleted"], ["tm-grey", "Rename only"], ["tm-plain", "No flag"]] },
  ],
  leafLine: l => `+${l.add} −${l.del}`,
  groupLine: (g, ls) => `${files(ls.length)} · ${lines(ls)}`,
});


for (const t of Object.values(TYPES)) t.changed = false;
const ROOTS = [{ sep: "The change" }, { t: "RefundDialog" }, { t: "RefundApi" }, { t: "OrderPage" },
  { sep: "Around it" }, { t: "Extras" }, { sep: "Checks" }, { t: "Checks" }];
const treeEl = document.getElementById("tree");
renderTree(treeEl, ROOTS);
document.querySelector(".tbtn").addEventListener("click", e => {
  const act = e.target.dataset.act;
  if (act === "open") openLevel(treeEl);
  if (act === "all") for (let i = 0; i < 6; i++) openLevel(treeEl);
  if (act === "reset") renderTree(treeEl, ROOTS);
});

</script>
